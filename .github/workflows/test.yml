name: Test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - id: tokens
        run: |
          cat << EOF >> $GITHUB_ENV
          TOKENS<<END
          {
              "<image-url>": "${{ format('Hello {0}', 'world') }}",
              "<base-url>": "github.com/cheezeproject",
          }
          END
          EOF
      - uses: cheezeproject/k8s-deploy@v1
        with:
          manifest: test/test.yml
          namespace: default
          tokens: ${{ env.TOKENS }}
          dry-run: true
      - uses: cheezeproject/k8s-deploy@v1
        with:
          manifest: test/test.yml
          namespace: default
          tokens: >-
            {
              "<image-url>": "${{ format('Hello {0}', 'world') }}",
              "<base-url>": "github.com/cheezeproject",
            }
          artifact: false
          dry-run: true
